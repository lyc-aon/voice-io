[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-io"
version = "0.1.0"
description = "Local English dictation, diarized meeting notes, and collaborative voice input"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
dependencies = [
    "sherpa-onnx==1.13.8",
    "sounddevice",
    "numpy",
    "sherpa-onnx-core==1.13.8",
]

[project.optional-dependencies]
mac = [
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
]

[project.scripts]
voice-io = "voice_io.__main__:main"

[tool.setuptools.packages.find]
include = ["voice_io*"]

[tool.setuptools.package-data]
voice_io = ["gnome_focus@voice-io/extension.js", "gnome_focus@voice-io/metadata.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
